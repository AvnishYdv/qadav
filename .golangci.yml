version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - bodyclose
    - errorlint
    - gosec
  disable:
    - lll
    - funlen
    - gocognit
    - cyclop
    - gosec
linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gosec:
    excludes:
      - G204
      - G304
      - G702
      - G703
issues:
  exclude-rules:
    - linters:
        - gosec
      text: "Subprocess launched|Path traversal|Command injection"
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

