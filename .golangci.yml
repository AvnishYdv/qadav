run:
  timeout: 5m
  tests: true
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - errorlint
    - gosec
  disable:
    - lll
    - funlen
    - gocognit
    - cyclop
linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gosec:
    excludes:
      - G204
      - G304
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

