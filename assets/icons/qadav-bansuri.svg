<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Bamboo Flute Gradient -->
    <linearGradient id="bansuri_wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- Peacock Feather Eye Gradients -->
    <radialGradient id="peacock_eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </radialGradient>
    <radialGradient id="peacock_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <!-- Golden Accent Gradient -->
    <linearGradient id="gold_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <!-- Drop Shadow / Glow for High Contrast on Dark & Light -->
    <filter id="flute_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#flute_shadow)">
    <!-- Peacock Feather (Mor Pankh) Accent on Top Right -->
    <!-- Feather Stem -->
    <path d="M46 18 C48 14, 52 10, 56 6" stroke="#047857" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Outer Feather Fan (Emerald) -->
    <path d="M56 6 C52 4, 46 8, 48 13 C49 15, 53 14, 56 6 Z" fill="#059669" opacity="0.9"/>
    <path d="M56 6 C58 9, 56 15, 51 16 C49 16, 50 13, 56 6 Z" fill="#10B981" opacity="0.85"/>
    <!-- Feather Outer Blue Oval -->
    <ellipse cx="51.5" cy="11.5" rx="4.5" ry="3.5" transform="rotate(-35 51.5 11.5)" fill="url(#peacock_eye)"/>
    <!-- Feather Golden Inner Center -->
    <ellipse cx="51.5" cy="11.5" rx="2.2" ry="1.6" transform="rotate(-35 51.5 11.5)" fill="url(#peacock_core)"/>
    <circle cx="51.5" cy="11.5" r="0.8" fill="#1E3A8A"/>

    <!-- Sacred Silk Tassel / Thread (Pavitra Dhaga) -->
    <path d="M44 20 C46 23, 46 26, 45 29" stroke="#E11D48" stroke-width="1" stroke-linecap="round"/>
    <circle cx="45" cy="29" r="1.2" fill="#F59E0B"/>
    <path d="M44.5 30 L43.5 35 M45 30 L45 36 M45.5 30 L46.5 35" stroke="#F59E0B" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Main Bamboo Flute (Bansuri) Body -->
    <!-- Outer Stroke for High Contrast -->
    <rect x="7" y="29.5" width="53" height="5.2" rx="2.6" transform="rotate(-45 32 32)" fill="url(#bansuri_wood)" stroke="#5A2800" stroke-width="1.2"/>

    <!-- Golden Flute End Rings (Bands) -->
    <!-- Top Band -->
    <rect x="44.2" y="30.2" width="2.4" height="4.8" rx="0.5" transform="rotate(-45 32 32)" fill="url(#gold_accent)" stroke="#78350F" stroke-width="0.6"/>
    <!-- Bottom Band -->
    <rect x="9.5" y="30.2" width="2.4" height="4.8" rx="0.5" transform="rotate(-45 32 32)" fill="url(#gold_accent)" stroke="#78350F" stroke-width="0.6"/>
    <!-- Middle Accent Ring -->
    <rect x="23" y="30.4" width="1.2" height="4.4" transform="rotate(-45 32 32)" fill="url(#gold_accent)"/>
    <rect x="37" y="30.4" width="1.2" height="4.4" transform="rotate(-45 32 32)" fill="url(#gold_accent)"/>

    <!-- Flute Holes (Transformed along rotated axis) -->
    <!-- Blow Hole (Embouchure) near Top -->
    <ellipse cx="43.5" cy="20.5" rx="1.6" ry="1.2" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>
    <ellipse cx="43.3" cy="20.3" rx="0.8" ry="0.5" fill="#1C0D02"/>

    <!-- 6 Playing Finger Holes along Flute -->
    <!-- Hole 1 -->
    <circle cx="37.5" cy="26.5" r="1.3" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>
    <!-- Hole 2 -->
    <circle cx="34.0" cy="30.0" r="1.3" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>
    <!-- Hole 3 -->
    <circle cx="30.5" cy="33.5" r="1.3" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>
    <!-- Gap between hands -->
    <!-- Hole 4 -->
    <circle cx="25.5" cy="38.5" r="1.3" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>
    <!-- Hole 5 -->
    <circle cx="22.0" cy="42.0" r="1.3" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>
    <!-- Hole 6 -->
    <circle cx="18.5" cy="45.5" r="1.3" fill="#3B1A00" stroke="#78350F" stroke-width="0.4"/>

    <!-- Flute Open Tip (Mouthpiece edge) -->
    <ellipse cx="49.5" cy="14.5" rx="1.8" ry="1.2" transform="rotate(45 49.5 14.5)" fill="#5A2800"/>
    <ellipse cx="14.5" cy="49.5" rx="1.8" ry="1.2" transform="rotate(45 14.5 49.5)" fill="#3B1A00"/>
  </g>
</svg>
